<main class="flex min-h-dvh flex-col px-(--page-x) pt-(--page-top) pb-(--page-bottom)">
  <header class="flex h-12 items-center justify-between">
    <span class="rounded-pill bg-surface px-3 py-[5px] font-body text-[13px] leading-[17px] font-black text-muted">
      18+
    </span>
    <a routerLink="/cai-dat" appIconButton aria-label="Cài đặt">
      <app-icon name="settings" />
    </a>
  </header>

  <section class="-mt-1.5 flex flex-col items-center text-center">
    <app-logo class="size-[92px]" />
    <h1 class="type-hero mt-2 text-text">
      Chén Vào,<br />
      <span class="text-primary">Chuyện Ra</span>
    </h1>
    <p class="type-body-s mt-1 text-muted">Thật hay Thách · drinking game cho hội bạn 18+</p>
  </section>

  <h2 id="mode-label" class="type-label mt-4 px-1 text-muted uppercase">Chọn cách chơi</h2>
  <app-mode-picker class="mt-2" aria-labelledby="mode-label" [(value)]="session.mode" />

  <app-players-summary class="mt-3" [players]="session.players()" />

  <div class="mt-2.5 flex h-14 items-center justify-between rounded-l bg-surface pr-2 pl-4">
    <span id="level-label" class="type-body-m text-text">Mức độ</span>
    <app-segmented aria-labelledby="level-label" [options]="levelOptions" [(value)]="session.level" />
  </div>

  <div class="min-h-6 flex-1"></div>

  <a appButton [routerLink]="startLink()">
    Bắt đầu chơi
    <app-icon name="arrow-right" [size]="22" [strokeWidth]="3" />
  </a>
  <p class="type-caption mt-2 text-center text-muted">Uống có trách nhiệm · Đã uống thì không lái xe</p>
</main>
