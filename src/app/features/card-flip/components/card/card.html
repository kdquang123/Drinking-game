<div
  class="scene"
  (click)="toggle()"
  (keydown.enter)="toggle()"
  (keydown.space)="$event.preventDefault(); toggle()"
>
  <div class="card" [class.flipped]="flipped()">
    <!-- Mặt sau -->
    <div class="face back">
      <span class="pill-top">Thật · Thách · Uống</span>
      <div class="question">?</div>
      <span class="pill-bottom">Chạm để lật</span>
    </div>
    <!-- Mặt trước -->
    <div class="face front">
      <div class="tags">
        <span class="tag" [class]="`bg-${color()} text-on-${color()}`">{{ cardKindText() }}</span>
        <span class="tag bg-[#00000012] text-ink">{{ cardLevelText() }}</span>
        <span class="num">#{{ card().id }}</span>
      </div>

      <div class="art">
        <app-card-illo
          class="rounded-[3cqw]"
          [illo]="card().illo"
          [kind]="card().kind"
        ></app-card-illo>
      </div>

      <p class="text">
        <span>{{ card()?.pre }}</span>
        <span [class]="`text-${color()}`">{{ card()?.hl }}</span>
        <span>{{ card()?.post }}</span>
      </p>

      <div class="action" [class]="`bg-${card()?.kind === 'drink' ? 'dare' : 'drink'}`">
        {{ cardActionText() }}
      </div>
    </div>
  </div>
</div>
