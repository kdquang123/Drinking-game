<div class="block w-fit mx-auto mt-4 px-2 py-1 bg-surface rounded-full type-caption text-muted">
  Đã rút {{ deck().length - useDeck().length }} · còn {{ useDeck().length }} thẻ
</div>
<p class="text-center type-display-l my-3">{{ titleText() }}</p>
<app-card
  class="min-h-0 shrink"
  [card]="current()"
  [flipped]="flipped()"
  (toggleCard)="next()"
></app-card>
<p class="text-center type-caption text-muted mt-3.5">
  {{ flipped() ? 'Chạm lần nữa để úp lại' : 'Chạm vào thẻ để lật' }}
</p>
<div class="flex-1 flex items-end">
  <div class="w-full flex items-center justify-between">
    <div class="flex gap-1.5">
      <div class="flex gap-1">
        <div class="w-3 h-3 bg-truth rounded-xs"></div>
        <span class="type-caption text-muted">Thật</span>
      </div>
      <div class="flex gap-1">
        <div class="w-3 h-3 bg-dare rounded-xs"></div>
        <span class="type-caption text-muted">Thách</span>
      </div>
      <div class="flex gap-1">
        <div class="w-3 h-3 bg-drink rounded-xs"></div>
        <span class="type-caption text-muted">Uống</span>
      </div>
    </div>

    <button class="flex items-center gap-2 px-3 py-2 bg-surface rounded-m text-ink">
      <app-icon name="shuffle" size="18"></app-icon>
      <span>Xáo lại bộ bài</span>
    </button>
  </div>
</div>
