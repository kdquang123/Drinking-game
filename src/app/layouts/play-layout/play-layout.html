<main class="flex h-dvh flex-col px-(--page-x) pt-(--page-top) pb-(--page-bottom)">
  <header class="flex shrink-0 h-12 items-center gap-3 justify-between">
    <div class="basis-0 flex-1 flex justify-start">
      <a routerLink="/" appIconButton aria-label="Về trang chủ">
        <app-icon name="home" [size]="24" [strokeWidth]="2.6" />
      </a>
    </div>
    @if (!selectedPlayer()) {
      <app-segmented
        class="bg-surface!"
        aria-labelledby="theme-label"
        [options]="PLAY_MODE"
        [value]="mode()"
        (valueChange)="onChangeMode($event)"
      />
    } @else {
      <h1 class="type-display-m text-text uppercase text-center">
        Lượt của {{ selectedPlayer()?.name }}
      </h1>
    }
    <div class="basis-0 flex-1 flex justify-end">
      <button appIconButton aria-label="Âm thanh" (click)="toast.comingSoon()">
        <app-icon name="sound" [size]="24" [strokeWidth]="2.6" />
      </button>
    </div>
  </header>
  <router-outlet />
</main>
